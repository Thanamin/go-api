version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: go-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go_api_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-go_api_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - go-api-network

  go-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.go-api
      args:
        BUILD_ENV: ${BUILD_ENV:-dev}
    container_name: go-api-server
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-go_api_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      HASH_METHOD: ${HASH_METHOD:-bcrypt}
      HASH_SECRET: ${HASH_SECRET:-default-secret-key}
      BCRYPT_COST: ${BCRYPT_COST:-10}
      JWT_SECRET: ${JWT_SECRET:-default-jwt-secret}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - go-api-network

volumes:
  postgres_data:
    driver: local

networks:
  go-api-network:
    driver: bridge
